        function ParticleBackground({ intensity = 1 }) {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];
                const colors = ['#E85D4E', '#3AA76D', '#F2A93B', '#5B7C99'];
                const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                window.addEventListener('resize', resize);
                resize();
                const isMobile = window.innerWidth < 768;
                // Giảm nhẹ số lượng hạt trên mobile để tối ưu hiệu năng và không rối mắt
                const particleCount = isMobile ? 15 * intensity : 40 * intensity;
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                        radius: Math.random() * 3 + 1, vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3 - 0.1, alpha: Math.random(), blinkSpeed: Math.random() * 0.02 + 0.005,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy; p.alpha += p.blinkSpeed;
                        if (p.alpha >= 1 || p.alpha <= 0) p.blinkSpeed = -p.blinkSpeed;
                        if (p.y < 0) p.y = canvas.height; if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = Math.abs(p.alpha) * 0.5;
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    });
                    animationFrameId = requestAnimationFrame(render);
                };
                render();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
            }, [intensity]);
            return <canvas ref={canvasRef} className="fixed inset-0 z-0 pointer-events-none opacity-60" />;
        }

        function CustomCursor() {
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

            useEffect(() => {
                const move = (e) => setMousePos({ x: e.clientX, y: e.clientY });
                const over = (e) => {
                    const tag = e.target.tagName.toLowerCase();
                    if (tag === 'button' || tag === 'select' || e.target.closest('button') || e.target.closest('a')) setHoverState('glow');
                    else if (tag === 'img' || e.target.closest('.gallery-item')) setHoverState('hover');
                    else setHoverState('');
                };
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseover', over);
                return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseover', over); };
            }, []);
            return (
                <div className="hidden md:block pointer-events-none fixed inset-0 z-[10000]">
                    <motion.div className="absolute w-2 h-2 bg-accent_green rounded-full shadow-[0_0_10px_rgba(58,167,109,0.5)]"

                </div>
            );
        }

        function CharReveal({ text, className, delay = 0, blur = false }) {
            const chars = Array.from(text);

                                <motion.p initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true, margin: "-10%" }} transition={{ delay: 0.4, duration: 1 }} className="font-sans text-[clamp(0.875rem,3vw,1rem)] text-text_main leading-relaxed whitespace-pre-line">Chập chững bước vào giảng đường,<br/>mang theo hoài bão và sự tò mò<br/>về thế giới rộng lớn.</motion.p>

        /* ------------------------------------------------------------------

           ------------------------------------------------------------------ */
        function CountdownSection() {
            const [timeLeft, setTimeLeft] = useState(null);
            const [isExpired, setIsExpired] = useState(false);
            const [showCelebration, setShowCelebration] = useState(false);

            useEffect(() => {
                const targetDateStr = `${siteConfig.graduationDate}T${siteConfig.graduationTime}+07:00`;
                const target = new Date(targetDateStr).getTime();
                const calculateTime = () => {
                    const now = new Date().getTime();
                    const difference = target - now;
                    if (difference > 0) {
                        setTimeLeft({ Ngày: Math.floor(difference / (1000 * 60 * 60 * 24)), Giờ: Math.floor((difference / (1000 * 60 * 60)) % 24), Phút: Math.floor((difference / 1000 / 60) % 60), Giây: Math.floor((difference / 1000) % 60) });
                        setIsExpired(false);
                    } else {
                        setTimeLeft(null); setIsExpired(true);
                        if (!showCelebration) { setShowCelebration(true); confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#E85D4E', '#3AA76D', '#F2A93B'] }); }
                    }
                };
                calculateTime(); const timer = setInterval(calculateTime, 1000); return () => clearInterval(timer);
            }, [showCelebration]);

            return (
                <section className="py-24 md:py-32 px-4 md:px-6 flex flex-col items-center bg-background w-full">
                    <CharReveal text="ĐẾM NGƯỢC ĐẾN NGÀY ĐẶC BIỆT" className="tracking-[0.2em] md:tracking-[0.3em] text-accent_green text-[10px] md:text-sm font-bold uppercase mb-12 md:mb-16 text-center" />
                    {isExpired ? (
                        <motion.div initial={{ scale: 0.8, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-center relative px-4">
                            <motion.div animate={{ y: [0, -20, 0] }} transition={{ duration: 2, repeat: Infinity, ease: "easeInOut" }} className="text-5xl md:text-6xl mb-6">🎓</motion.div>

                    ) : (
                        timeLeft && (
                            <div className="grid grid-cols-2 sm:flex sm:flex-wrap justify-center gap-3 md:gap-8 w-full max-w-[280px] sm:max-w-none mx-auto">
                                {Object.entries(timeLeft).map(([unit, value]) => (
                                    <div key={unit} className="flex flex-col items-center glass-panel p-3 sm:p-4 md:p-8 rounded-xl md:rounded-2xl border border-accent_green/20 w-full sm:w-[100px] md:w-[140px] shadow-lg shadow-black/5 relative overflow-hidden group">
                                        <div className="h-[36px] sm:h-[40px] md:h-[70px] relative overflow-hidden w-full flex justify-center mb-1 md:mb-2">
                                            <AnimatePresence mode="popLayout">
                                                <motion.span key={value} initial={{ y: "100%", opacity: 0, scale: 0.8 }} animate={{ y: "0%", opacity: 1, scale: 1 }} exit={{ y: "-100%", opacity: 0, scale: 0.8 }} transition={{ duration: 0.6, type: "spring", bounce: 0.2 }} className="font-serif text-3xl sm:text-4xl md:text-6xl text-accent_orange absolute font-bold leading-none">{value.toString().padStart(2, '0')}</motion.span>
                                            </AnimatePresence>
                                        </div>
                                        <span className="text-[10px] md:text-sm tracking-[0.1em] md:tracking-[0.2em] text-accent_orange uppercase font-bold">{unit}</span>
                                    </div>
                                ))}
                            </div>
                        )
                    )}
                </section>
            );
        }

                <div className="w-full">
                    <p className={`font-sans text-[clamp(0.875rem,3vw,1rem)] text-text_main leading-relaxed whitespace-pre-line word-wrap-anywhere ${expanded ? '' : 'line-clamp-4'}`}>{text}</p>

        function WishesSection() {
            const [wishes, setWishes] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchWishes = async () => {
                    try {
                        const response = await fetch(`${dbConfig.supabaseUrl}/rest/v1/${dbConfig.tableName}?select=*&publicMessage=eq.true&approved=eq.true&order=created_at.desc`, {
                            headers: { 'apikey': dbConfig.supabaseAnonKey, 'Authorization': `Bearer ${dbConfig.supabaseAnonKey}` }
                        });
                        const data = await response.json();
                        if (response.ok) {
                            setWishes(data);
                        } else {
                            console.error("Lỗi lấy dữ liệu Supabase:", data);
                        }
                    } catch (error) { 
                        console.error(error); 
                    } finally { 
                        setLoading(false); 
                    }
                };
                fetchWishes();
            }, []);

            useEffect(() => {
                const handleNewWish = (e) => {
                    setWishes(prevWishes => [e.detail, ...prevWishes]);
                };
                window.addEventListener('newWishAdded', handleNewWish);
                return () => window.removeEventListener('newWishAdded', handleNewWish);
            }, []);

            return (
                <section className="py-24 md:py-32 px-4 md:px-6 relative overflow-hidden bg-surface w-full">

        /* ------------------------------------------------------------------
           RSVP SECTION 
           ------------------------------------------------------------------ */
        function RSVPSection() {
            const [view, setView] = useState('buttons'); 
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitError, setSubmitError] = useState(false);
            const [attendance, setAttendance] = useState('Tôi sẽ tham dự 🎉');
            const [isPublic, setIsPublic] = useState(true);
            const [formData, setFormData] = useState({ name: '', guests: '1 người', message: '' });

            const handleSelectAttendance = (isAttending) => { setAttendance(isAttending ? 'Tôi sẽ tham dự 🎉' : 'Rất tiếc, tôi không thể tham dự'); setView('form'); };
            const handleChange = (e) => { setFormData({ ...formData, [e.target.name]: e.target.value }); };

            const handleSubmit = async (e) => {
                e.preventDefault(); setIsSubmitting(true); setSubmitError(false);
                const payloadFormspree = { name: formData.name, attendance: attendance, message: formData.message, publicMessage: isPublic };
                if (attendance.includes('sẽ tham dự')) payloadFormspree.guests = formData.guests;

                try {
                    const formspreeRes = fetch('https://formspree.io/f/xqagrdej', { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify(payloadFormspree) });
                    
                    let supabaseRes = null;
                    if (formData.message.trim() !== '') {
                        supabaseRes = fetch(`${dbConfig.supabaseUrl}/rest/v1/${dbConfig.tableName}`, { 
                            method: 'POST', 
                            headers: { 'apikey': dbConfig.supabaseAnonKey, 'Authorization': `Bearer ${dbConfig.supabaseAnonKey}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }, 
                            body: JSON.stringify({ name: formData.name, message: formData.message, publicMessage: isPublic, approved: true }) 
                        });
                    }
                    
                    const [res1] = await Promise.all([formspreeRes, supabaseRes].filter(Boolean));
                    
                    if (res1.ok) { 
                        setView('success'); 
                        if (isPublic && formData.message.trim() !== '') {
                            const newWish = { id: Date.now(), name: formData.name, message: formData.message };
                            window.dispatchEvent(new CustomEvent('newWishAdded', { detail: newWish }));
                        }
                    } else { 
                        setSubmitError(true); 
                    }
                } catch (error) { setSubmitError(true); } finally { setIsSubmitting(false); }
            };

            useEffect(() => { if (view === 'success') { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#E85D4E', '#3AA76D', '#F2A93B'] }); } }, [view]);

            return (
                <section id="rsvp" className="py-24 md:py-32 px-4 md:px-6 text-center relative overflow-hidden pb-16 md:pb-20 bg-background w-full">
                    <div className="max-w-xl mx-auto bg-white p-6 sm:p-8 md:p-16 border border-black/5 shadow-2xl rounded-2xl md:rounded-3xl relative z-10 w-full">
                        <CharReveal text="BẠN SẼ ĐẾN CHỨ?" className="font-serif text-[clamp(1.8rem,6vw,3rem)] mb-4 md:mb-6 text-accent_green font-bold tracking-wide" />
                        <p className="text-text_muted font-serif italic text-[clamp(1rem,4vw,1.25rem)] mb-8 md:mb-12 px-2">"Sự hiện diện của bạn sẽ làm cho ngày này trở nên đặc biệt hơn rất nhiều."</p>
                        <AnimatePresence mode="wait">
                            {view === 'buttons' && (
                                <motion.div key="buttons" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0, scale: 0.9 }} className="flex flex-col sm:flex-row justify-center gap-4 sm:gap-6">
                                    <motion.button whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }} onClick={() => handleSelectAttendance(true)} className="w-full sm:w-auto px-6 md:px-8 py-4 md:py-5 bg-accent_green text-white rounded-full font-bold tracking-[0.1em] text-xs md:text-sm uppercase shadow-lg shadow-accent_green/30">Tôi Sẽ Tham Dự ❤️</motion.button>
                                    <motion.button whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }} onClick={() => handleSelectAttendance(false)} className="w-full sm:w-auto px-6 md:px-8 py-4 md:py-5 border-2 border-black/10 text-text_main rounded-full font-bold tracking-[0.1em] text-xs md:text-sm uppercase hover:bg-black/5">Rất Tiếc, Không Thể</motion.button>
                                </motion.div>
                            )}
                            {view === 'form' && (
                                <motion.form key="form" initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0 }} onSubmit={handleSubmit} className="flex flex-col space-y-6 md:space-y-8 text-left w-full">
                                    <div className="w-full"><label className="block text-[10px] md:text-xs uppercase tracking-[0.2em] text-accent_green mb-2 font-bold">Họ và tên *</label><input type="text" name="name" value={formData.name} onChange={handleChange} required className="w-full border-b-2 border-black/10 py-2 md:py-3 bg-transparent focus:outline-none focus:border-accent_green text-text_main text-lg md:text-xl font-serif italic transition-colors" placeholder="Nhập tên của bạn" /></div>
                                    {attendance.includes('sẽ tham dự') && ( <div className="w-full"><label className="block text-[10px] md:text-xs uppercase tracking-[0.2em] text-accent_green mb-2 font-bold">Số người tham dự *</label><div className="relative w-full"><select name="guests" value={formData.guests} onChange={handleChange} required className="w-full border-b-2 border-black/10 py-2 md:py-3 bg-transparent focus:outline-none focus:border-accent_green text-text_main text-lg md:text-xl font-serif transition-colors appearance-none pr-10"><option value="1 người">1 người</option><option value="2 người">2 người</option><option value="3 người">3 người</option><option value="4 người">4 người</option><option value="Khác">Khác</option></select><div className="absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none text-accent_green"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div></div></div> )}
                                    <div className="w-full">
                                        <label className="block text-[10px] md:text-xs uppercase tracking-[0.2em] text-accent_green mb-2 font-bold">Lời chúc dành cho Mạnh</label>
                                        <textarea name="message" value={formData.message} onChange={handleChange} rows="3" className="w-full border-b-2 border-black/10 py-2 md:py-3 bg-transparent focus:outline-none focus:border-accent_green text-text_main text-lg md:text-xl font-serif italic resize-none transition-colors" placeholder="Gửi một lời chúc đến Mạnh... 🎓"></textarea>
                                        <div className="mt-4 flex items-start space-x-3 cursor-pointer group" onClick={() => setIsPublic(!isPublic)}>
                                            <div className={`mt-0.5 w-5 h-5 rounded border-2 flex-shrink-0 flex items-center justify-center transition-colors ${isPublic ? 'bg-accent_green border-accent_green' : 'border-black/20 group-hover:border-accent_green/50'}`}>
                                                {isPublic && <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-3 h-3"><polyline points="20 6 9 17 4 12"></polyline></svg>}
                                            </div>
                                            <div className="flex-1">
                                                <p className="text-sm font-sans text-text_main font-medium select-none leading-snug">Cho phép hiển thị lời chúc trên website</p>
                                                <p className="text-[10px] text-text_muted font-sans mt-1 leading-snug">Nếu không chọn, lời chúc sẽ gửi riêng và không xuất hiện công khai.</p>
                                            </div>
                                        </div>
                                    </div>
                                    {submitError && ( <p className="text-red-500 text-sm text-center font-sans tracking-wide word-wrap-anywhere px-2">Có lỗi xảy ra khi gửi thông tin.<br/>Vui lòng thử lại sau ít phút.</p> )}
                                    <motion.button disabled={isSubmitting} whileHover={!isSubmitting ? { scale: 1.02 } : {}} whileTap={!isSubmitting ? { scale: 0.98 } : {}} type="submit" className={`w-full py-4 md:py-5 bg-accent_red text-white rounded-full tracking-[0.2em] text-xs md:text-sm font-bold uppercase mt-6 md:mt-8 relative flex justify-center shadow-lg shadow-accent_red/30 ${isSubmitting ? 'opacity-70 cursor-not-allowed' : ''}`}>{isSubmitting ? 'ĐANG GỬI...' : 'GỬI XÁC NHẬN'}</motion.button>
                                </motion.form>
                            )}
                            {view === 'success' && (
                                <motion.div key="success" initial={{ opacity: 0, scale: 0.8 }} animate={{ opacity: 1, scale: 1 }} className="text-center py-8 md:py-12 relative w-full">
                                    <motion.div initial={{ scale: 0, rotate: -90 }} animate={{ scale: 1, rotate: 0 }} transition={{ type: "spring", delay: 0.2 }} className="w-20 h-20 md:w-24 md:h-24 mx-auto border-4 border-accent_green rounded-full flex items-center justify-center mb-6 md:mb-8 bg-accent_green/10"><svg xmlns="http://www.w3.org/2000/svg" className="text-accent_green h-10 w-10 md:h-12 md:w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg></motion.div>
                                    <h4 className="font-serif text-[clamp(2rem,6vw,3rem)] text-accent_red font-bold mb-4 md:mb-6 tracking-wider">🎓 CẢM ƠN BẠN!</h4>
                                    <p className="text-[clamp(1rem,4vw,1.25rem)] text-text_main font-serif italic relative z-10 leading-relaxed mb-4 px-2">Lời chúc của bạn đã được gửi đến Mạnh.</p>
                                    <div className="bg-surface border border-accent_green/20 p-3 md:p-4 rounded-xl relative z-10 w-full">
                                        <p className="text-[10px] md:text-sm font-sans text-accent_green font-medium tracking-wide leading-snug">
                                            {isPublic ? "Lời chúc của bạn đã được hiển thị công khai trên website." : "Lời chúc của bạn sẽ chỉ được gửi riêng đến Mạnh."}
                                        </p>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </div>
                </section>
            );
        }

        /* ------------------------------------------------------------------
           CONTACT FOOTER
           ------------------------------------------------------------------ */
        function ContactFooter() {
            return (
                <footer className="py-24 md:py-32 text-center px-4 md:px-6 relative border-t border-black/5 bg-surface overflow-hidden w-full">
                    <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 1 }} className="relative z-10 max-w-2xl mx-auto w-full">
                        <CharReveal text="HẸN GẶP BẠN TRONG NGÀY ĐẶC BIỆT 🎓" className="font-serif text-[clamp(1.2rem,4vw,2.25rem)] text-accent_green font-bold mb-4 md:mb-6 tracking-[0.1em] md:tracking-widest uppercase" />
                        <p className="text-text_main font-serif italic text-[clamp(1rem,3vw,1.25rem)] mb-10 md:mb-12 px-2">Nếu bạn cần liên hệ hoặc muốn gửi lời chúc riêng, hãy tìm mình qua những thông tin dưới đây nhé.</p>

                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                                <span className="font-sans text-[11px] md:text-sm tracking-widest font-bold relative overflow-hidden">
                                    FACEBOOK
                                    <span className="absolute bottom-0 left-0 w-full h-[2px] bg-accent_green transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300"></span>

                        <p className="text-[10px] md:text-xs text-text_muted font-serif italic px-2">&copy; {siteConfig.graduationYear} &bull; Made with memories & a little bit of caffeine. ☕</p>

                </footer>

        }

        /* ------------------------------------------------------------------
           ROOT APP COMPONENT
           ------------------------------------------------------------------ */
        function App() {
            const [isOpen, setIsOpen] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [lightboxIdx, setLightboxIdx] = useState(null);
            const [showTooltip, setShowTooltip] = useState(false);
            const audioRef = useRef(null);
            
            const { scrollYProgress } = useScroll();
            const heroY = useTransform(scrollYProgress, [0, 1], ["0%", "40%"]);

            useEffect(() => { if (audioRef.current) audioRef.current.volume = 0.3; }, []);
            const openInvitation = () => { 
                setIsOpen(true); 
                if (audioRef.current) {
                    audioRef.current.play().catch(error => console.log("Trình duyệt chặn autoplay:", error));
                    setIsPlaying(true);
                }
            };
            const toggleMusic = () => {
                if (!audioRef.current) return;
                if (isPlaying) audioRef.current.pause(); else audioRef.current.play();
                setIsPlaying(!isPlaying);
            };

            useEffect(() => { document.body.style.overflow = isOpen ? 'unset' : 'hidden'; if (isOpen) window.scrollTo(0, 0); }, [isOpen]);

            return (
                <div className="relative font-sans text-text_main bg-background w-full overflow-hidden">
                    <CustomCursor />
                    <ParticleBackground intensity={isOpen ? 1 : 0.3} />
                    
                    {isOpen && <InsideFloatingIcons />}

                    <audio ref={audioRef} src={siteConfig.musicUrl} loop />

                    <AnimatePresence>
                        {isOpen && (
                            <motion.div initial={{ opacity: 0, scale: 0 }} animate={{ opacity: 1, scale: 1 }} transition={{ delay: 1 }} className="fixed bottom-6 right-6 md:bottom-8 md:right-8 z-50 flex flex-col items-center" onMouseEnter={() => setShowTooltip(true)} onMouseLeave={() => setShowTooltip(false)}>
                                {showTooltip && ( <div className="hidden md:block absolute -top-10 whitespace-nowrap bg-white shadow-lg border border-black/5 px-3 py-1 rounded-md text-[10px] uppercase tracking-widest text-accent_green font-bold tooltip-enter">{isPlaying ? "Tắt Nhạc" : "Bật Nhạc"}</div> )}
                                <motion.button onClick={toggleMusic} whileHover={{ scale: 1.1 }} whileTap={{ scale: 0.9 }} className="relative p-3 md:p-4 bg-accent_green rounded-full text-white hover:bg-accent_green/90 shadow-lg shadow-accent_green/30 transition-colors group">
                                    <motion.div animate={{ rotate: isPlaying ? 360 : 0 }} transition={{ duration: 10, repeat: Infinity, ease: "linear" }}>
                                        <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 md:w-6 md:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            {isPlaying ? ( <path strokeLinecap="round" strokeLinejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /> ) : ( <path strokeLinecap="round" strokeLinejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /> )}
                                        </svg>
                                    </motion.div>
                                </motion.button>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* OPENING SCREEN (BÊN NGOÀI) */}
                    <AnimatePresence>
                        {!isOpen && (
                            <motion.div exit={{ opacity: 0, scale: 1.05, filter: "blur(10px)" }} transition={{ duration: 1.2, ease: [0.76, 0, 0.24, 1] }} className="fixed inset-0 z-[60] flex flex-col items-center justify-center bg-background overflow-hidden w-full px-4">
                                
                                <OpeningFloatingIcons />

                                <motion.div className="relative z-20 flex flex-col items-center text-center w-full max-w-[100vw]">
                                    <motion.div initial={{ scale: 0, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} transition={{ delay: 0.5, duration: 1, type: "spring" }} className="mb-4 md:mb-6 text-accent_green"><svg xmlns="http://www.w3.org/2000/svg" className="w-12 h-12 md:w-16 md:h-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg></motion.div>
                                    <CharReveal text="TRÂN TRỌNG KÍNH MỜI" delay={1} className="tracking-[0.2em] md:tracking-[0.3em] text-[10px] md:text-sm text-accent_green mb-3 md:mb-4 font-bold uppercase" />
                                    <motion.p initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 2, duration: 1 }} className="font-serif italic text-text_muted mb-6 md:mb-8 text-base md:text-xl">đến dự lễ tốt nghiệp của</motion.p>
                                    <CharReveal text="TÂN KỸ SƯ" delay={2.5} className="font-serif text-[clamp(2.5rem,8vw,4.5rem)] mb-3 md:mb-4 text-accent_red tracking-wider uppercase font-bold" />
                                    <motion.p initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 4, duration: 1 }} className="font-serif text-[clamp(1.2rem,4vw,1.5rem)] text-accent_blue mb-10 md:mb-16 italic font-medium">Khóa 2021-2026 </motion.p>
                                    <motion.button initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 4.5, duration: 1 }} whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }} onClick={openInvitation} className="px-8 md:px-10 py-3 md:py-4 border-2 border-accent_green text-accent_green text-[10px] md:text-sm tracking-[0.2em] uppercase transition-all duration-300 hover:bg-accent_green hover:text-white rounded-full font-bold shadow-lg shadow-accent_green/20"><span className="relative z-10">MỞ THƯ MỜI</span></motion.button>
                                </motion.div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* MAIN CONTENT */}
                    <div style={{ opacity: isOpen ? 1 : 0, transition: 'opacity 1.5s ease-in-out' }} className="relative z-10 w-full overflow-hidden">
                        <section id="home" className="min-h-screen flex flex-col items-center justify-center relative px-4 md:px-6 text-center overflow-hidden w-full">
                            <motion.div style={{ y: heroY }} className="absolute inset-0 z-0 opacity-40"><img src={siteConfig.heroImage} className="w-full h-full object-cover" alt="" /><div className="absolute inset-0 bg-gradient-to-b from-background/40 via-background/80 to-background"></div></motion.div>
                            <div className="relative z-10 flex flex-col items-center mt-12 md:mt-20 w-full">
                                <motion.p initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 1 }} className="tracking-[0.1em] md:tracking-[0.2em] text-accent_orange text-[10px] md:text-sm font-bold uppercase mb-4 md:mb-6">Ngày Đặc Biệt Đã Đến</motion.p>
                                <CharReveal text="LỄ TỐT NGHIỆP" delay={0.3} className="font-serif text-[clamp(2.5rem,8vw,5.5rem)] leading-tight mb-2 md:mb-4 tracking-wider text-accent_green uppercase font-bold" />
                                <motion.h2 initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} transition={{ delay: 1, duration: 1 }} className="font-serif italic text-[clamp(1.5rem,5vw,2.25rem)] text-text_muted mb-10 md:mb-16">Của Mình </motion.h2>
                                <motion.div initial={{ height: 0, opacity: 0 }} whileInView={{ height: "auto", opacity: 1 }} viewport={{ once: true }} transition={{ duration: 1.5, ease: "easeInOut" }} className="w-full max-w-[280px] sm:max-w-sm aspect-[3/4] p-2 bg-white border border-black/5 shadow-2xl rounded-2xl overflow-hidden relative mx-auto"><motion.img initial={{ scale: 1.2, filter: "blur(5px)" }} whileInView={{ scale: 1, filter: "blur(0px)" }} transition={{ duration: 2, ease: "easeOut" }} src={siteConfig.heroImage} alt="Portrait" className="w-full h-full object-cover object-[30%_center] rounded-xl" /></motion.div>
                                <motion.div animate={{ y: [0, 10, 0] }} transition={{ repeat: Infinity, duration: 2, ease: "easeInOut" }} className="mt-12 md:mt-20 text-accent_green"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"></polyline></svg></motion.div>
                            </div>
                        </section>

                        <section id="story" className="py-24 md:py-40 px-4 md:px-6 flex flex-col items-center text-center relative w-full">
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-px h-20 md:h-32 bg-gradient-to-b from-transparent to-accent_green/30"></div>
                            <CharReveal text={siteConfig.story.title.toUpperCase()} className="font-serif text-[clamp(1.8rem,5vw,3rem)] leading-tight mb-10 md:mb-16 text-accent_red tracking-[0.1em] font-bold" />
                            <div className="w-full max-w-2xl mx-auto space-y-8 md:space-y-12 px-2">
                                {siteConfig.story.paragraphs.map((text, idx) => ( <LineReveal key={idx} text={text} delay={idx * 0.2} className="text-[clamp(1rem,3vw,1.5rem)] font-serif leading-relaxed text-text_main font-medium word-wrap-anywhere" /> ))}
                            </div>
                        </section>

                        <CinematicTimeline />
                        <CountdownSection />

                        <section id="memories" className="py-24 md:py-40 px-4 md:px-6 relative bg-surface w-full">
                            <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} className="text-center mb-12 md:mb-20">
                                <h3 className="font-serif text-[clamp(2rem,6vw,3rem)] tracking-[0.1em] text-accent_green uppercase font-bold leading-tight">Những Kỷ Niệm</h3><p className="font-serif italic text-text_muted text-lg md:text-xl mt-3 md:mt-4 font-medium">Lưu giữ từng khoảnh khắc</p>
                            </motion.div>
                            <div className="max-w-6xl mx-auto columns-1 sm:columns-2 lg:columns-3 gap-4 md:gap-6 space-y-4 md:space-y-6">
                                {siteConfig.galleryImages.map((src, idx) => (
                                    <motion.div key={idx} initial={{ opacity: 0, scale: 0.8, filter: "blur(10px)", y: 50 }} whileInView={{ opacity: 1, scale: 1, filter: "blur(0px)", y: 0 }} viewport={{ once: true, margin: "-50px" }} transition={{ duration: 0.8, delay: (idx % 3) * 0.15, type: "spring", bounce: 0.2 }} onClick={() => setLightboxIdx(idx)} className="gallery-item break-inside-avoid overflow-hidden rounded-xl md:rounded-2xl shadow-lg relative group border border-black/5 bg-white p-1.5 md:p-2 cursor-pointer">
                                        <motion.div animate={{ y: [0, -2, 0] }} transition={{ duration: 4 + (idx % 3), repeat: Infinity, ease: "easeInOut" }} className="w-full h-full rounded-lg md:rounded-xl overflow-hidden relative">
                                            <img src={src} alt={`Kỷ niệm ${idx}`} className="w-full h-auto object-cover transition-transform duration-700 group-hover:scale-105" loading="lazy" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-accent_green/90 via-accent_green/20 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-500 flex items-end justify-center pb-6 md:pb-8"><span className="font-sans text-[10px] md:text-xs tracking-[0.2em] text-white opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-500 font-bold">XEM ẢNH</span></div>
                                        </motion.div>
                                    </motion.div>
                                ))}
                            </div>
                        </section>

                        <section className="py-24 md:py-40 px-4 md:px-6 text-center relative overflow-hidden bg-background w-full">
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-px h-20 md:h-32 bg-gradient-to-b from-transparent to-accent_red/20"></div>
                            <CharReveal text={siteConfig.thankYou.title.toUpperCase()} className="font-serif text-[clamp(2rem,6vw,3rem)] mb-8 md:mb-12 text-accent_red tracking-[0.1em] font-bold" />
                            <div className="w-full max-w-4xl mx-auto space-y-8 md:space-y-10 relative z-10 px-2">
                                <motion.p initial={{ opacity: 0, scale: 0.9 }} whileInView={{ opacity: 1, scale: 1 }} viewport={{ once: true, margin: "-100px" }} transition={{ duration: 1.5, ease: "easeOut" }} className="text-[clamp(1.25rem,4vw,2.25rem)] font-serif italic text-accent_green leading-relaxed mb-10 md:mb-16 font-bold">"{siteConfig.thankYou.highlight}"</motion.p>
                                {siteConfig.thankYou.paragraphs.map((text, idx) => ( <LineReveal key={idx} text={text} delay={idx * 0.2} className="text-[clamp(1rem,3vw,1.25rem)] font-serif text-text_main font-medium word-wrap-anywhere" /> ))}
                            </div>
                        </section>

                        <CeremonySection />
                        <WishesSection />
                        <RSVPSection />
                        <ContactFooter />

                    </div>
                    
                    <AnimatePresence>
                        {lightboxIdx !== null && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                                <button onClick={() => setLightboxIdx(null)} className="absolute top-4 right-4 md:top-6 md:right-6 p-2 md:p-4 text-white hover:text-accent_orange transition-colors z-50"><svg xmlns="http://www.w3.org/2000/svg" className="w-8 h-8 md:w-10 md:h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                                <div className="absolute inset-y-0 left-0 w-1/4 md:w-1/3 cursor-w-resize z-40" onClick={() => setLightboxIdx((lightboxIdx - 1 + siteConfig.galleryImages.length) % siteConfig.galleryImages.length)} />
                                <div className="absolute inset-y-0 right-0 w-1/4 md:w-1/3 cursor-e-resize z-40" onClick={() => setLightboxIdx((lightboxIdx + 1) % siteConfig.galleryImages.length)} />
                                <motion.img key={lightboxIdx} initial={{ opacity: 0, scale: 0.9, x: 50 }} animate={{ opacity: 1, scale: 1, x: 0 }} exit={{ opacity: 0, scale: 0.9, x: -50 }} transition={{ duration: 0.4, type: "spring" }} src={siteConfig.galleryImages[lightboxIdx]} className="max-w-full max-h-[80vh] md:max-h-[85vh] object-contain shadow-2xl relative z-10 pointer-events-none rounded-lg md:rounded-xl" />
                                <p className="absolute bottom-6 md:bottom-10 font-sans tracking-[0.2em] text-xs md:text-sm text-white/70 font-medium">{lightboxIdx + 1} / {siteConfig.galleryImages.length}</p>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
